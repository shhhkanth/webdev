<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>

    <div class="page-header">
        <h1>Manage Students</h1>
        <a href="index.html" class="btn-secondary">+ Register New</a>
    </div>

    <div id="msg-banner" class="msg-banner" style="display:none;"></div>

    <div class="table-wrapper">
        <table id="studentTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Reg No</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>DOB</th>
                    <th>Gender</th>
                    <th>Course</th>
                    <th>Department</th>
                    <th>Semester</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="11" class="loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h2>Edit Student</h2>
            <form id="editForm" action="students" method="post" onsubmit="return validateEditForm()">
                <input type="hidden" name="action" value="update">
                <input type="hidden" name="id" id="edit-id">

                <div class="modal-grid">
                    <div class="field-group">
                        <label for="edit-name">Full Name <span class="required">*</span></label>
                        <input type="text" id="edit-name" name="name" required>
                        <span class="field-error" id="edit-name-error"></span>
                    </div>
                    <div class="field-group">
                        <label for="edit-regno">Register Number <span class="required">*</span></label>
                        <input type="text" id="edit-regno" name="regno" required>
                        <span class="field-error" id="edit-regno-error"></span>
                    </div>
                    <div class="field-group">
                        <label for="edit-email">Email <span class="required">*</span></label>
                        <input type="email" id="edit-email" name="email" required>
                        <span class="field-error" id="edit-email-error"></span>
                    </div>
                    <div class="field-group">
                        <label for="edit-phone">Phone <span class="required">*</span></label>
                        <input type="tel" id="edit-phone" name="phone" maxlength="10" required>
                        <span class="field-error" id="edit-phone-error"></span>
                    </div>
                    <div class="field-group">
                        <label for="edit-dob">Date of Birth <span class="required">*</span></label>
                        <input type="date" id="edit-dob" name="dob" required>
                    </div>
                    <div class="field-group">
                        <label for="edit-gender">Gender <span class="required">*</span></label>
                        <select id="edit-gender" name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="edit-course">Course <span class="required">*</span></label>
                        <input type="text" id="edit-course" name="course" required>
                    </div>
                    <div class="field-group">
                        <label for="edit-department">Department <span class="required">*</span></label>
                        <input type="text" id="edit-department" name="department" required>
                    </div>
                    <div class="field-group">
                        <label for="edit-semester">Semester <span class="required">*</span></label>
                        <select id="edit-semester" name="semester" required>
                            <option value="Semester I">Semester I</option>
                            <option value="Semester II">Semester II</option>
                            <option value="Semester III">Semester III</option>
                            <option value="Semester IV">Semester IV</option>
                        </select>
                    </div>
                    <div class="field-group full-width">
                        <label for="edit-address">Address</label>
                        <textarea id="edit-address" name="address" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <button type="button" class="btn-reset" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="deleteModal" class="modal-overlay" style="display:none;">
        <div class="modal modal-sm">
            <h2>Confirm Delete</h2>
            <p>Are you sure you want to delete this student? This cannot be undone.</p>
            <div class="form-actions">
                <a id="confirmDeleteBtn" href="#" class="btn-danger">Yes, Delete</a>
                <button type="button" class="btn-reset" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="manage.js" defer></script>
</body>
</html>
